<head>
<meta charset="UTF-8">

<title>O Lobo da Floresta Negra | Robson V. Souza</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#020508;color:#fff;font-family:Georgia,"Times New Roman",serif}
body{overflow-x:hidden}
.site{position:relative;max-width:1536px;margin:auto;line-height:0}
.art{display:block;width:100%;height:auto}
.hotspot{
 position:absolute;z-index:10;display:block;cursor:pointer;
 background:rgba(255,255,255,0);border:0;padding:0;border-radius:8px;
 transition:background .2s,box-shadow .2s,transform .2s;
}
.hotspot:hover,.hotspot:focus-visible{
 background:rgba(255,255,255,.08);
 box-shadow:0 0 0 1px rgba(255,255,255,.35),0 0 22px rgba(255,255,255,.12);
 outline:none;
}
.hotspot:active{transform:scale(.98)}

/* áreas proporcionais à arte enviada */
.menu-inicio{left:34.3%;top:1.35%;width:4.8%;height:3.8%}
.menu-livro{left:40.5%;top:1.35%;width:8.8%;height:3.8%}
.menu-historia{left:50%;top:1.35%;width:8.3%;height:3.8%}
.menu-autor{left:59%;top:1.35%;width:6.1%;height:3.8%}
.menu-comprar{left:65.6%;top:1.35%;width:7.4%;height:3.8%}
.menu-contato{left:73%;top:1.35%;width:7.3%;height:3.8%}

.whatsapp-top{left:80.4%;top:.75%;width:18.4%;height:5.2%}
.whatsapp-hero{left:37.5%;top:24.4%;width:28%;height:5.9%}
.instagram{left:15.8%;top:82.9%;width:15.5%;height:5.4%}
.facebook{left:33.7%;top:82.9%;width:15.6%;height:5.4%}
.tiktok{left:51.3%;top:82.9%;width:15.5%;height:5.4%}
.email{left:68.2%;top:82.9%;width:16.7%;height:5.4%}
.whatsapp-footer{left:60.7%;top:89.8%;width:19.5%;height:5.4%}
.uiclap{left:82.8%;top:89.8%;width:16.1%;height:5.4%}

/* botão auxiliar para celular */
.mobile-help{
 position:fixed;right:14px;bottom:14px;z-index:50;
 width:48px;height:48px;border-radius:50%;border:1px solid #6edb9c;
 background:#087d43;color:#fff;font:bold 21px Arial;
 box-shadow:0 5px 20px #0008;display:none;align-items:center;justify-content:center;
}
.tooltip{
 position:fixed;z-index:60;pointer-events:none;opacity:0;
 padding:8px 11px;border-radius:7px;background:#05090d;color:#fff;
 border:1px solid #40515b;font:12px Arial,sans-serif;transition:opacity .15s;
 transform:translate(-50%,-120%);
}
.modal-backdrop{
 position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
 padding:20px;background:rgba(0,0,0,.78);backdrop-filter:blur(7px);
}
.modal-backdrop.open{display:flex}
.modal{
 width:min(560px,100%);max-height:88vh;overflow:auto;
 background:linear-gradient(145deg,#0b171e,#020609);
 border:1px solid #4b606b;border-radius:14px;
 box-shadow:0 25px 80px #000;line-height:1.55;padding:28px;
 position:relative;
}
.modal h2{margin:0 42px 8px 0;font-size:30px;color:#eee5dc}
.modal .kicker{font:700 10px Arial,sans-serif;letter-spacing:3px;color:#e33a43;text-transform:uppercase}
.modal p,.modal li{color:#c1cbd0;font:15px/1.65 Arial,sans-serif}
.modal ul{padding-left:20px}
.close{position:absolute;right:15px;top:12px;width:38px;height:38px;border:1px solid #586871;border-radius:50%;background:#081016;color:#fff;font-size:22px;cursor:pointer}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.modal-actions a{
 display:inline-block;padding:11px 15px;border-radius:7px;
 font:700 12px Arial,sans-serif;color:#fff;text-decoration:none;border:1px solid #52636c;
}
.modal-actions .wa{background:#087f43;border-color:#30d878}
.modal-actions .buy{background:#9d6810;border-color:#e0b84f;color:#fff}
.modal-actions .social{background:#111c22}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

@media(max-width:700px){
 .mobile-help{display:flex}
 .hotspot:hover{background:transparent;box-shadow:none}
 .modal{padding:23px 19px}
 .modal h2{font-size:25px}
}
</style>

const modal=document.getElementById("modal");
const content=document.getElementById("modal-content");
const close=document.getElementById("close");
let lastFocus=null;

function openModal(key){
  lastFocus=document.activeElement;
  content.innerHTML=contents[key] || contents.inicio;
  modal.classList.add("open");
  document.body.style.overflow="hidden";
  close.focus();
}
function closeModal(){
  modal.classList.remove("open");
  document.body.style.overflow="";
  if(lastFocus) lastFocus.focus();
}

document.querySelectorAll("[data-modal]").forEach(btn=>btn.addEventListener("click",()=>openModal(btn.dataset.modal)));
close.addEventListener("click",closeModal);
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape" && modal.classList.contains("open"))closeModal()});

const help=document.getElementById("help");
help.addEventListener("click",()=>openModal("contato"));

/* pequenas dicas ao passar o mouse no desktop */
const labels={
 "menu-inicio":"Início","menu-livro":"Sobre o livro","menu-historia":"A história",
 "menu-autor":"O autor","menu-comprar":"Comprar","menu-contato":"Contato"
};
const tooltip=document.getElementById("tooltip");
document.querySelectorAll(".hotspot").forEach(el=>{
  const key=[...el.classList].find(c=>labels[c]);
  if(!key)return;
  el.addEventListener("mouseenter",e=>{tooltip.textContent=labels[key];tooltip.style.left=e.clientX+"px";tooltip.style.top=e.clientY+"px";tooltip.style.opacity="1"});
  el.addEventListener("mousemove",e=>{tooltip.style.left=e.clientX+"px";tooltip.style.top=e.clientY+"px"});
  el.addEventListener("mouseleave",()=>tooltip.style.opacity="0");
});
</script>
